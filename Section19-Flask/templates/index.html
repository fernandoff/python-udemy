{% extends 'base.html' %}
{% block conteudo %}
<h2 style="text-align: center;">Lista de Frutas</h2>
<hr>
<ul class="list-group">
	{% for fruta in frutas %}
		<li class="list-group-item">{{fruta}}</li>
	{% endfor %}
	<form action="{{url_for('principal')}}" method="POST" class="mt-3">
		<div class="form-group">
			<label for="exemploFruta">Fruta</label>
			<input class="form-control mt-3" id="exemploFruta" type="text" name="fruta" placeholder="Digite o nome de uma fruta">
		</div>
		
		<button class="btn btn-success mt-3">Adicionar</button>
	</form>
</ul>
{% endblock conteudo %}
