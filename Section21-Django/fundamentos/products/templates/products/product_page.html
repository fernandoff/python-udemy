{% extends 'layout.html' %}
{% block title %}
    {{product.name}}
{% endblock %}
{% block content %}
    <section>
        <img
            class="banner"
            src="{{product.banner.url}}"
            alt="{{product.name}}"
            style="margin: 0 auto"
        />
        <br>
        <h2>{{product.name}}</h2>
        <p>R${{product.price}}</p>
        <p>Estoque:{{product.stock}}</p>
    </section>
{% endblock %}
